name: Hello CI

on:
  push:
  workflow_dispatch:
    inputs:
      NAME:
        description: "A random input name for the workflow"
        type: string
      SOME_VALUE:
        description: "Some other input to pass"
        type: string

permissions:
  contents: read

jobs:
  hello:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Hello from ${{ github.repository }} @ ${{ github.sha }}"
          git --version
